services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govbuild
      POSTGRES_USER: govbuild
      POSTGRES_PASSWORD: govbuild-dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govbuild -d govbuild"]
      interval: 5s
      timeout: 5s
      retries: 10

  marketplace:
    build: ./services/marketplace
    environment:
      PORT: 4830
      DATABASE_URL: postgresql://govbuild:govbuild-dev@postgres:5432/govbuild
      MARKETPLACE_INTERNAL_TOKEN: local-marketplace-token
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4830:4830"

  web:
    build: ./web
    environment:
      DATABASE_URL: postgresql://govbuild:govbuild-dev@postgres:5432/govbuild
      MARKETPLACE_API_URL: http://marketplace:4830
      MARKETPLACE_INTERNAL_TOKEN: local-marketplace-token
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      marketplace:
        condition: service_started
    ports:
      - "4820:4820"

volumes:
  postgres-data:
