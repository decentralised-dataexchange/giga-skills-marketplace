services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govbuild
      POSTGRES_USER: govbuild
      POSTGRES_PASSWORD: govbuild-dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govbuild -d govbuild"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    environment:
      DATABASE_URL: postgresql://govbuild:govbuild-dev@postgres:5432/govbuild
      # Optional: raises GitHub's API limit for repository submissions
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # demo (default) seeds and offers the demo accounts; production does
      # neither and needs the super admin below (password >= 12 characters).
      MARKETPLACE_MODE: ${MARKETPLACE_MODE:-demo}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4820:4820"

volumes:
  postgres-data:
