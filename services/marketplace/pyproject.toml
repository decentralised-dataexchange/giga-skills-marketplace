[project]
name = "giga-marketplace"
version = "0.1.0"
description = "FastAPI service for the public Giga Skills Marketplace catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1,<1",
  "psycopg[binary,pool]>=3.2.9,<4",
  "uvicorn[standard]>=0.35.0,<1",
]

[project.scripts]
marketplace = "marketplace.__main__:main"

[dependency-groups]
dev = ["httpx>=0.28.1,<1", "pytest>=8.4.1,<9", "ruff>=0.12.7,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
