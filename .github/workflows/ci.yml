name: CI

# Quality gates on every push and pull request:
# OXC for repo lint/format, and tsc + eslint for the web app.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  helm:
    name: Lint and render (Helm chart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint ./deploy/helm/giga --set postgres.password=ci-dummy
      - name: helm template (default and staging values)
        run: |
          helm template giga ./deploy/helm/giga \
            --set postgres.password=ci-dummy >/dev/null
          helm template giga ./deploy/helm/giga \
            -f ./deploy/helm/giga/values-staging.yaml \
            --set postgres.password=ci-dummy >/dev/null

  oxc:
    name: Lint and format (OXC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: oxlint
        run: npm run lint
      - name: oxfmt (check)
        run: npm run format:check

  web:
    name: Typecheck and eslint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web
      - name: ESLint
        run: npx eslint app components lib
        working-directory: web
