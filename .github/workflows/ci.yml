name: CI

# Quality gates on every push and pull request:
# Ruff + pytest for the marketplace API, OXC for repo lint/format, and
# tsc + eslint for the web app.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  marketplace:
    name: Lint and test (FastAPI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: govbuild
          POSTGRES_USER: govbuild
          POSTGRES_PASSWORD: govbuild-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govbuild -d govbuild"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://govbuild:govbuild-test@localhost:5432/govbuild
    defaults:
      run:
        working-directory: services/marketplace
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: services/marketplace/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Pytest
        run: uv run pytest
      - name: Build and smoke-test production image
        run: |
          docker build --tag giga-marketplace-ci .
          docker run --detach --rm --network host \
            --name giga-marketplace-ci \
            --env DATABASE_URL="$TEST_DATABASE_URL" \
            giga-marketplace-ci
          trap 'docker stop giga-marketplace-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4830/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs giga-marketplace-ci
          exit 1

  oxc:
    name: Lint and format (OXC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install tooling
        run: npm ci
      - name: oxlint
        run: npm run lint
      - name: oxfmt (check)
        run: npm run format:check

  web:
    name: Typecheck and eslint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: web
      - name: ESLint
        run: npx eslint app components lib
        working-directory: web
