name: Deploy to GKE

# Builds the images that changed and rolls out the affected Helm releases on
# every merge to main. Authenticates to GCP with Workload Identity Federation
# (no long-lived keys): the github-pool provider `ai-integrator` (the GCP
# resource keeps its pre-rename id) lets this repo impersonate the
# ddx-github service account.
#
# Speed comes from three things:
# - path filtering: only the applications whose sources changed are rebuilt
#   and redeployed;
# - parallel build jobs: the images build side by side, not in sequence;
# - BuildKit caching through the GitHub Actions cache: unchanged dependency
#   and build layers are reused between runs.
# When a release deploys but one of its images was not rebuilt (for example
# a chart-only change), the previous image content is retagged to the new
# commit tag with a manifest-only copy, so Helm always references a tag that
# exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for WIF

env:
  PROJECT_ID: jenkins-189019
  REGISTRY: eu.gcr.io/jenkins-189019
  CLUSTER: igrant-cluster
  CLUSTER_LOCATION: europe-west4-c
  NAMESPACE: giga
  WIF_PROVIDER: projects/872246932852/locations/global/workloadIdentityPools/github-pool/providers/ai-integrator
  DEPLOY_SA: ddx-github@jenkins-189019.iam.gserviceaccount.com

# Every job checks github.repository so forks of this open-source repo skip
# the deploy cleanly: the WIF provider only trusts this repository, and forks
# have neither the federation trust nor the Actions secrets.

jobs:
  changes:
    if: github.repository == 'decentralised-dataexchange/giga-skills-marketplace'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      web: ${{ steps.filter.outputs.web }}
      marketplace: ${{ steps.filter.outputs.marketplace }}
      giga_release: ${{ steps.filter.outputs.giga_release }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # A manual dispatch builds and deploys everything.
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: some
          filters: |
            web:
              - 'web/**'
            marketplace:
              - 'services/marketplace/**'
            giga_release:
              - 'web/**'
              - 'services/marketplace/**'
              - 'deploy/helm/giga/**'
              - '.github/workflows/deploy.yml'

  build-web:
    needs: changes
    if: >-
      github.repository == 'decentralised-dataexchange/giga-skills-marketplace' &&
      (needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker eu.gcr.io --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push giga-web
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/giga-web:${{ needs.changes.outputs.tag }}
            ${{ env.REGISTRY }}/giga-web:latest
          cache-from: type=gha,scope=giga-web
          cache-to: type=gha,scope=giga-web,mode=max

  build-marketplace:
    needs: changes
    if: >-
      github.repository == 'decentralised-dataexchange/giga-skills-marketplace' &&
      (needs.changes.outputs.marketplace == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker eu.gcr.io --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push giga-marketplace
        uses: docker/build-push-action@v6
        with:
          context: services/marketplace
          file: services/marketplace/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/giga-marketplace:${{ needs.changes.outputs.tag }}
            ${{ env.REGISTRY }}/giga-marketplace:latest
          cache-from: type=gha,scope=giga-marketplace
          cache-to: type=gha,scope=giga-marketplace,mode=max

  deploy-giga:
    needs: [changes, build-web, build-marketplace]
    # Runs when anything in the giga release changed; tolerates the build
    # jobs being skipped (unchanged application), never their failure.
    if: >-
      always() && !failure() && !cancelled() &&
      github.repository == 'decentralised-dataexchange/giga-skills-marketplace' &&
      (needs.changes.outputs.giga_release == 'true' || github.event_name == 'workflow_dispatch')
    # One deploy against the cluster at a time.
    concurrency:
      group: deploy-giga
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker eu.gcr.io --quiet

      # A release rolls both images under one tag; give an unchanged (and so
      # unbuilt) image the new tag with a manifest-only copy.
      - name: Ensure both images carry the release tag
        run: |
          if [ "${{ needs.changes.outputs.web }}" != "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            docker buildx imagetools create -t "$REGISTRY/giga-web:${{ needs.changes.outputs.tag }}" "$REGISTRY/giga-web:latest"
          fi
          if [ "${{ needs.changes.outputs.marketplace }}" != "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            docker buildx imagetools create -t "$REGISTRY/giga-marketplace:${{ needs.changes.outputs.tag }}" "$REGISTRY/giga-marketplace:latest"
          fi

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.CLUSTER_LOCATION }}
      - uses: azure/setup-helm@v4
      - name: Deploy with Helm
        run: |
          helm upgrade --install giga ./deploy/helm/giga \
            --namespace "$NAMESPACE" --create-namespace \
            -f ./deploy/helm/giga/values-staging.yaml \
            --set image.tag=${{ needs.changes.outputs.tag }} \
            --set postgres.password="$POSTGRES_PASSWORD" \
            --wait --timeout 6m
          kubectl -n "$NAMESPACE" rollout status deploy/giga-web --timeout=5m
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
