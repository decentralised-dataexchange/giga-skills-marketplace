apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.name }}-secrets
type: Opaque
stringData:
  IGRANT_API_KEY: {{ required "secrets.igrantApiKey is required" .Values.secrets.igrantApiKey | quote }}
  MOE_IGRANT_API_KEY: {{ required "secrets.moeIgrantApiKey is required" .Values.secrets.moeIgrantApiKey | quote }}
  CIVICWORKS_IGRANT_API_KEY: {{ required "secrets.civicworksIgrantApiKey is required" .Values.secrets.civicworksIgrantApiKey | quote }}
  MOE_WEBHOOK_SECRET: {{ required "secrets.moeWebhookSecret is required" .Values.secrets.moeWebhookSecret | quote }}
  CIVICWORKS_WEBHOOK_SECRET: {{ required "secrets.civicworksWebhookSecret is required" .Values.secrets.civicworksWebhookSecret | quote }}
  BETTER_AUTH_SECRET: {{ required "secrets.betterAuthSecret is required" .Values.secrets.betterAuthSecret | quote }}
  LEARNER_PSEUDONYM_PEPPER: {{ required "secrets.learnerPseudonymPepper is required" .Values.secrets.learnerPseudonymPepper | quote }}
