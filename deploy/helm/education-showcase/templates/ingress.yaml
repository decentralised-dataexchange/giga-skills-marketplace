# Shares the marketplace host: ingress-nginx merges the rules of every
# Ingress that names the same host, and the marketplace ingress already
# terminates TLS for it, so this one carries no tls block (the certificate
# secret lives in the marketplace namespace).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.app.name }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: {{ .Values.basePath }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.app.name }}
                port:
                  number: 80
