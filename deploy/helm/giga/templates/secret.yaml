{{- $internalToken := required "marketplace.internalToken is required (set via -f values-secret.yaml or --set marketplace.internalToken=...)" .Values.marketplace.internalToken -}}
{{- $pgPassword := .Values.postgres.password -}}
{{- $databaseUrl := .Values.postgres.externalDatabaseUrl -}}
{{- if not $databaseUrl -}}
{{- $pgPassword = required "postgres.password is required when postgres.externalDatabaseUrl is not set" $pgPassword -}}
{{- $databaseUrl = printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user $pgPassword .Values.postgres.name .Values.postgres.db -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: giga-secrets
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.db | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  MARKETPLACE_INTERNAL_TOKEN: {{ $internalToken | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}
