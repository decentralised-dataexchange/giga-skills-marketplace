{{- $pgPassword := required "postgres.password is required (set via -f values-secret.yaml or --set postgres.password=...)" .Values.postgres.password -}}
{{- $internalToken := required "marketplace.internalToken is required (set via -f values-secret.yaml or --set marketplace.internalToken=...)" .Values.marketplace.internalToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: giga-secrets
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.db | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  MARKETPLACE_INTERNAL_TOKEN: {{ $internalToken | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.user }}:{{ $pgPassword }}@{{ .Values.postgres.name }}:5432/{{ .Values.postgres.db }}"
