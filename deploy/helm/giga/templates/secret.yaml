{{- $pgPassword := .Values.postgres.password -}}
{{- $databaseUrl := .Values.postgres.externalDatabaseUrl -}}
{{- if not $databaseUrl -}}
{{- $pgPassword = required "postgres.password is required when postgres.externalDatabaseUrl is not set" $pgPassword -}}
{{- $databaseUrl = printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user $pgPassword .Values.postgres.name .Values.postgres.db -}}
{{- end -}}
{{- if not (has .Values.mode (list "demo" "production")) -}}
{{- fail (printf "mode must be \"demo\" or \"production\", got %q" .Values.mode) -}}
{{- end -}}
{{- if eq .Values.mode "production" -}}
{{- $_ := required "superadmin.email is required when mode is production" .Values.superadmin.email -}}
{{- $_ = required "superadmin.password is required when mode is production" .Values.superadmin.password -}}
{{- end -}}
{{- if and .Values.superadmin.email (not .Values.superadmin.password) -}}
{{- fail "superadmin.password is required when superadmin.email is set" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: giga-secrets
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.db | quote }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  DATABASE_URL: {{ $databaseUrl | quote }}
  {{- if .Values.githubToken }}
  GITHUB_TOKEN: {{ .Values.githubToken | quote }}
  {{- end }}
  {{- if .Values.superadmin.password }}
  SUPERADMIN_PASSWORD: {{ .Values.superadmin.password | quote }}
  {{- end }}
