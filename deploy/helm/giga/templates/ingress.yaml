apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: giga
  annotations:
    {{- if .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.clusterIssuer }}
  tls:
    - hosts:
        - {{ .Values.domain }}
      secretName: {{ .Values.ingress.tlsSecret }}
    {{- with .Values.redirect.domains }}
    - hosts:
        {{- range . }}
        - {{ . }}
        {{- end }}
      secretName: {{ $.Values.redirect.tlsSecret }}
    {{- end }}
  {{- end }}
  rules:
    # Earlier hostnames (redirect.domains) also route to the web app, and
    # web/proxy.ts answers them with a permanent redirect to `domain`.
    {{- range prepend .Values.redirect.domains .Values.domain }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.web.name }}
                port:
                  number: 80
    {{- end }}
