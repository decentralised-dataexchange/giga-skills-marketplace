apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.web.name }}
  labels:
    app: {{ .Values.web.name }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.web.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.web.name }}
    spec:
      containers:
        - name: web
          image: {{ .Values.image.registry }}/{{ .Values.web.name }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: giga-secrets
                  key: DATABASE_URL
            - name: MARKETPLACE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: giga-secrets
                  key: MARKETPLACE_INTERNAL_TOKEN
            - name: MARKETPLACE_API_URL
              value: "http://{{ .Values.marketplace.name }}:{{ .Values.marketplace.port }}"
            - name: DB_MAX_CONNECTIONS
              value: {{ .Values.web.dbMaxConnections | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.web.name }}
spec:
  selector:
    app: {{ .Values.web.name }}
  ports:
    - port: 80
      targetPort: {{ .Values.web.port }}
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.web.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.web.name }}
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.web.name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Values.web.name }}
