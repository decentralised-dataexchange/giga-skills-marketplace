apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.web.name }}
  labels:
    app: {{ .Values.web.name }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  # Replace pods in place: the cluster is CPU-packed, so a surge pod would
  # sit Pending forever and stall the rollout.
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Values.web.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.web.name }}
    spec:
      containers:
        - name: web
          image: {{ .Values.image.registry }}/{{ .Values.web.name }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: giga-secrets
                  key: DATABASE_URL
            - name: MARKETPLACE_API_URL
              value: "http://{{ .Values.marketplace.name }}:{{ .Values.marketplace.port }}"
            - name: NEXT_PUBLIC_SITE_URL
              value: "https://{{ .Values.domain }}"
            - name: DB_MAX_CONNECTIONS
              value: {{ .Values.web.dbMaxConnections | quote }}
            {{- if .Values.githubToken }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: giga-secrets
                  key: GITHUB_TOKEN
            {{- end }}
            {{- range $name, $value := .Values.showcase.config }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          # Showcase secrets (OWS API keys, pseudonym pepper), created
          # out-of-band by deploy/create-showcase-secret.sh.
          # Optional: without it the site runs and only the showcase's
          # wallet broker calls fail with their safe configuration errors.
          envFrom:
            - secretRef:
                name: {{ .Values.showcase.existingSecret }}
                optional: true
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.port }}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.web.name }}
spec:
  selector:
    app: {{ .Values.web.name }}
  ports:
    - port: 80
      targetPort: {{ .Values.web.port }}
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.web.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.web.name }}
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.web.name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Values.web.name }}
