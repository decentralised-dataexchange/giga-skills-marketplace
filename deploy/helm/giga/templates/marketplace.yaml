apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.marketplace.name }}
  labels:
    app: {{ .Values.marketplace.name }}
spec:
  {{- if not .Values.marketplace.autoscaling.enabled }}
  replicas: {{ .Values.marketplace.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.marketplace.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.marketplace.name }}
    spec:
      containers:
        - name: marketplace
          image: {{ .Values.image.registry }}/{{ .Values.marketplace.name }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.marketplace.port }}
          env:
            - name: PORT
              value: {{ .Values.marketplace.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: giga-secrets
                  key: DATABASE_URL
            - name: DB_MAX_CONNECTIONS
              value: {{ .Values.marketplace.dbMaxConnections | quote }}
          readinessProbe:
            # /ready also requires the catalog schema (bootstrapped by the web
            # app), so the service takes no traffic before it can answer.
            httpGet:
              path: /ready
              port: {{ .Values.marketplace.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.marketplace.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.marketplace.name }}
spec:
  selector:
    app: {{ .Values.marketplace.name }}
  ports:
    - port: {{ .Values.marketplace.port }}
      targetPort: {{ .Values.marketplace.port }}
{{- if .Values.marketplace.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.marketplace.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.marketplace.name }}
  minReplicas: {{ .Values.marketplace.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.marketplace.autoscaling.maxReplicas }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.marketplace.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.marketplace.name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ .Values.marketplace.name }}
