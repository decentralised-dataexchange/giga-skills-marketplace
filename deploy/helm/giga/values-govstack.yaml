# GovStack sandbox preset: the Kubernetes cluster that VanillaCore runs for
# the marketplace, reached over WireGuard. Deployed by hand with Helm from a
# machine on the VPN (see deploy/README.md); CI cannot reach this cluster.
#
# Non-secret and safe to commit. The database password comes from --set or
# a gitignored values-secret file.

# Placeholder until VanillaCore gives the public hostname and routes it to the
# Contour load balancer (10.0.0.100). Then set it here and set
# ingress.clusterIssuer to letsencrypt-prod to get a certificate.
domain: skills-marketplace.govstack.internal

mode: demo

# Public image, published by .github/workflows/publish-image.yml.
image:
  registry: ghcr.io/decentralised-dataexchange

# The same demo-tenant showcase as staging (see values-staging.yaml). The OWS
# API keys and the pseudonym pepper are a copy of the staging
# giga-showcase-secrets cluster secret, so pseudonyms in a copied staging
# database stay valid.
showcase:
  config:
    IGRANT_BASE_URL: "https://demo-api.igrant.io"
    STUDENT_ID_CREDENTIAL_ID: "b7463013-6d42-4740-9493-740a3367fe84"
    DIPLOMA_CREDENTIAL_ID: "2eb096f7-9d7a-47d5-9314-f95b6133c874"
    PID_PRESENTATION_DEFINITION_ID: "773c4107-bf7b-4c7f-8d11-b0c1b7be7131"
    PAYMENT_PRESENTATION_DEFINITION_ID: "d5965a9b-0c44-49ac-9539-c632acf1f645"
    PAYMENT_CARD_PRESENTATION_DEFINITION_ID: "0c288364-d472-4c46-a287-c0b355a604d7"
    DIPLOMA_PRESENTATION_DEFINITION_ID: "727a48d1-49e2-40cd-918b-07dcc9dfef60"
    AGREEMENT_ENROLMENT_ID: "6a7e4d0dd22651ae4335d5f2"
    AGREEMENT_ANALYTICS_ID: "6a7e4d1dd22651ae4335d5fb"
    AGREEMENT_EMPLOYER_ID: "6a7e4d1ed22651ae4335d603"

web:
  # The cluster has no metrics server, so the autoscaler cannot work.
  autoscaling:
    enabled: false

ingress:
  className: contour
  clusterIssuer: ""
