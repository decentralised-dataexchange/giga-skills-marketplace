# Default values for the ITU Skills Marketplace chart.
#
# The defaults here are neutral placeholders so the chart is safe to publish
# and deploy anywhere. For each environment, override at least `domain`,
# `image.registry` and `ingress.tlsSecret` with a values file or --set flags.
# The committed, non-secret staging preset in values-staging.yaml is a
# complete worked example.
#
# The postgres.password secret is intentionally blank here so this file is
# safe to commit. Supply it at deploy time via either:
#   helm upgrade ... -f values-secret.yaml            (gitignored local file)
#   helm upgrade ... --set postgres.password=...

# Public hostname of the marketplace. Override for your environment.
domain: marketplace.example.org

# Earlier hostnames of the marketplace. They share one TLS certificate
# (stored in redirect.tlsSecret), and the web app answers every request to
# them with a permanent redirect (308) to the same path on `domain`, so old
# links keep working.
redirect:
  domains: []
  tlsSecret: giga-redirect-tls

# Optional GitHub token for repository submissions; raises GitHub's API rate
# limit (60/hour per IP unauthenticated). Supply it like the database password,
# via values-secret.yaml or --set githubToken=... - never commit it here.
githubToken: ""

# The starting mode of the marketplace (MARKETPLACE_MODE of the web app):
#   demo        the first boot seeds the demo accounts, organisations and
#               skills, and the sign-in page offers "Use a demo account".
#   production  no demo data is seeded, the sign-in page shows no demo
#               accounts, and superadmin.email/password are required.
# A super admin can switch demo mode on or off later under Dashboard ->
# Settings; the stored setting then wins over this value.
mode: demo

# The operator's super admin account, bootstrapped by the web app on every
# boot: created when missing; its password, role and status follow these
# values, so rotate the secret and restart to change them. Required in
# production mode (the only account that can grant governance roles). The
# password is a secret (at least 12 characters): supply it like the database
# password, via values-secret.yaml or --set superadmin.password=... - never
# commit it here.
superadmin:
  email: ""
  name: "Marketplace Operator"
  password: ""

image:
  # Registry that hosts the giga-web image. Build it from the repository
  # Dockerfile and push it to a registry you control.
  registry: registry.example.org
  tag: "latest"
  pullPolicy: IfNotPresent

web:
  name: giga-web
  port: 4820
  replicas: 2
  dbMaxConnections: 8
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# Non-secret configuration of the education showcase, served by the web app
# under /showcase. Empty by default: the site deploys fine without it, and
# only the showcase wallet flows need it. To enable them, create the
# credential and presentation definitions once with
# web/scripts/showcase-provision.mjs and put the resulting ids here (see
# values-staging.yaml for the full shape). The secrets (OWS API keys,
# pseudonym pepper) never go through the chart: an operator creates the
# cluster secret below once with deploy/create-showcase-secret.sh, and the
# web deployment mounts it as optional env.
showcase:
  config: {}
  existingSecret: giga-showcase-secrets

postgres:
  # The bundled single-node database is convenient for demos. For production,
  # set enabled=false and provide externalDatabaseUrl from a secret values file.
  enabled: true
  externalDatabaseUrl: ""
  name: giga-postgres
  image: postgres:16-alpine
  db: govbuild
  user: govbuild
  password: ""        # REQUIRED: database password
  storage: 5Gi
  # storageClassName: ""   # unset -> cluster default

ingress:
  className: nginx
  clusterIssuer: letsencrypt-prod
  # cert-manager stores the issued certificate in this secret.
  tlsSecret: giga-tls
